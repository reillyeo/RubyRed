[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchlex"
version = "1.0.0"
description = "FASTQ demultiplexer for Oxford Nanopore data with barcode-based sample identification"
requires-python = ">=3.8"
dependencies = [
    "biopython>=1.79",
    "polyleven>=0.7",
    "numpy>=1.21",
]

[project.scripts]
torchlex = "torchlex.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"torchlex.data" = ["*.fasta"]
